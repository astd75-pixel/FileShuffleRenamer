name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        run: pyinstaller --clean --noconfirm FileShuffleRenamer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FileShuffleRenamer-Windows-x64
          path: dist/FileShuffleRenamer.exe
      - name: Publish release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileShuffleRenamer.exe
